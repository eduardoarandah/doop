[package]
name = "doop-desktop"
version = "0.1.2"
description = "Desktop shell for doop — a thin webview over the hosted app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Repositioning the traffic lights over the web app's tab strip (main.rs);
# AppKit resets them on window events, so the shell moves them itself.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[profile.release]
strip = true
lto = true
